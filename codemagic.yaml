workflows:
  ios-teste:
    name: Lembra iOS (teste sem assinatura)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: lembra/flutter_app
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Dependencias
        script: flutter pub get
      - name: Pods
        script: |
          cd ios
          pod install
      - name: Build iOS sem assinatura
        script: flutter build ios --release --no-codesign